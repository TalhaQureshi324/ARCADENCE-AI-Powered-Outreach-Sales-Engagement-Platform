name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scala:
    name: Scala — format check + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - uses: coursier/setup-action@v1
        with:
          apps: sbt

      - name: Format check (scalafmt)
        run: sbt scalafmtCheckAll

      - name: Unit tests
        run: sbt test

  web:
    name: Web — lint + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build

  migrations:
    name: Database — migrations apply cleanly (plain PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arcadence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations in order
        run: |
          set -euo pipefail
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "::group::applying $f"
            psql -h localhost -U postgres -d arcadence -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done

      - name: Verify foundational schema + RLS
        run: |
          set -euo pipefail
          # every tenant table must be RLS-enabled
          psql -h localhost -U postgres -d arcadence -v ON_ERROR_STOP=1 -t -c "
            select c.relname from pg_class c
            join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public' and c.relkind = 'r'
              and c.relname in ('profile','organization','workspace','workspace_member','invitation','audit_log','webhook_endpoint','webhook_delivery')
              and c.relrowsecurity = false" | grep -q . && {
            echo "ERROR: found tenant tables without RLS"; exit 1;
          } || echo "RLS verified on all tenant tables"
          # helper functions exist
          psql -h localhost -U postgres -d arcadence -v ON_ERROR_STOP=1 -t -c "
            select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public' and p.proname in
              ('current_user_id','current_user_email','is_workspace_member','has_workspace_role')" \
            | grep -q 4 || { echo "ERROR: tenancy helpers missing"; exit 1; }
          echo "Schema verification passed."
