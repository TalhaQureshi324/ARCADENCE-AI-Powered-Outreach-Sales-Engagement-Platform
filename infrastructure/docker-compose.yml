name: arcadence

services:
  api:
    image: arcadence/arcadence-api:0.1.0-SNAPSHOT
    container_name: arcadence-api
    ports:
      # Host 18080: 8080 inside the container; some Windows services (e.g. AgentService) occupy 8080.
      - "18080:8080"
    env_file:
      - ../apps/api/.env.local
    # Inside the compose network, localhost is not the host machine —
    # point the database at the local Supabase stack via host.docker.internal.
    environment:
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker:
    image: arcadence/arcadence-worker:0.1.0-SNAPSHOT
    container_name: arcadence-worker
    env_file:
      - ../apps/worker/.env.local
    environment:
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
